name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website
        shell: bash
        run: |
          mkdir -p .pages-stage
          cp index.html .pages-stage/
          for directory in css js vendor assets examples; do
            if [ -d "$directory" ]; then
              cp -R "$directory" .pages-stage/
            fi
          done
          touch .pages-stage/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-stage
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
